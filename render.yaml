services:
  - type: web
    name: emg-shipping-web
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: bash ./build.sh
    startCommand: gunicorn shipping.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --log-file -
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: emg-shipping-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: emg-shipping-db
    plan: free
    region: frankfurt
